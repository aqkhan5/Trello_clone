<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/quasha.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quasha - Modern Team Collaboration</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS with Quasha Neon Green Design DNA -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'primary': '#10e565',
              'primary-container': '#10b981',
              'on-primary': '#09090b',
              'on-primary-container': '#dcfce7',
              'secondary': '#05df72',
              'secondary-container': '#16a34a',
              'on-secondary': '#09090b',
              'on-secondary-container': '#bbf7d0',
              'neon': '#10e565',
              'neon-dark': '#05df72',
              'tertiary': '#10b981',
              'tertiary-container': '#047857',
              'on-tertiary': '#ffffff',
              'on-tertiary-container': '#a7f3d0',
              'surface': '#09090b',
              'on-surface': '#f4f4f5',
              'surface-container': '#18181b',
              'surface-container-low': '#121215',
              'surface-container-high': '#27272a',
              'surface-container-highest': '#3f3f46',
              'surface-container-lowest': '#09090b',
              'surface-variant': '#27272a',
              'on-surface-variant': '#a1a1aa',
              'inverse-surface': '#fafafa',
              'inverse-on-surface': '#09090b',
              'outline': '#3f3f46',
              'outline-variant': '#52525b',
              'error': '#f43f5e',
              'error-container': '#881337',
              'on-error': '#ffffff',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-surface text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
